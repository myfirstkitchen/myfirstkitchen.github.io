<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recipes — First Kitchen</title>
<meta name="description" content="Recipe cards that use only what ships in your First Kitchen box.">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="recipes">
<main>
<div class="wrap">
  <div class="page-head solo">
    <div>
      <h1 class="display" style="font-size:clamp(2.2rem,4.6vw,3.6rem)">Recipes written for your box</h1>
      <p class="lede">Every recipe names the pan, oil and spices it uses, and all of them come with a Standard or Full kit. Open a card for the steps.</p>
    </div>
  </div>
  <div class="grid" id="list" style="padding-bottom:70px"></div>
</div>
</main>
<script src="data.js"></script>
<script src="site.js"></script>
<script>
(function(){
var FK=window.FK;
document.getElementById("list").innerHTML=FK.RECIPES.map(function(r){
  return '<div class="card recipe" id="'+r.id+'"><h3>'+r.t+'</h3><p style="margin:6px 0 12px">'+r.time+', '+r.lvl.toLowerCase()+'</p>'+
  r.needs.map(function(n){return '<span class="pill">'+n+'</span>'}).join("")+
  '<details><summary>Show the steps</summary><ol>'+r.steps.map(function(s){return '<li>'+s+'</li>'}).join("")+'</ol></details></div>';
}).join("");
var h=location.hash&&document.querySelector(location.hash);
if(h){h.querySelector("details").open=true;h.scrollIntoView({block:"center"})}
})();
</script>
</body>
</html>
