<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Product — First Kitchen</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="product">
<main>
<div class="wrap">
  <div class="crumbs"><a href="shop.html">Shop</a> / <a id="catLink" href="shop.html"></a> / <span id="crumb"></span></div>
  <div class="pd" id="pd"></div>
  <div class="head-row" style="margin-top:50px"><h2 class="h2">More to shop</h2><a class="link" href="shop.html">See everything</a></div>
  <div class="grid" id="more" style="padding-bottom:70px"></div>
</div>
</main>
<script src="data.js"></script>
<script src="site.js"></script>
<script>
(function(){
var FK=window.FK,money=FK.money,$=function(i){return document.getElementById(i)};
var q=new URLSearchParams(location.search);
var c=FK.cookById(q.get("id"))||FK.COOK[0];
var existing=FK.getSet();
var sel={size:0,color:q.get("color")||(existing&&existing.color)||"sage",qty:1};
if(existing&&existing.cook&&existing.cook[c.id]&&existing.cook[c.id].qty>0)sel.size=existing.cook[c.id].size;
document.title=c.n+" — First Kitchen";
$("crumb").textContent=c.n;
$("catLink").textContent=c.cat==="appliances"?"Appliances":"Cookware";
$("catLink").href="shop.html?cat="+c.cat;

function render(){
  var s=c.s[sel.size];
  var colors=c.noColor?"":'<label class="f" id="cl">Color</label><div class="colors" role="group" aria-labelledby="cl">'+FK.COLORS.map(function(k){return '<button type="button" class="col'+(sel.color===k.id?' on':'')+'" data-color="'+k.id+'" aria-pressed="'+(sel.color===k.id)+'"><div class="sw sm" style="background:'+k.c+'"></div>'+k.n+'</button>'}).join("")+'</div>';
  $("pd").innerHTML=
    '<div class="pic big">'+FK.art(c.kind,c.noColor?"#8FA88B":FK.colorHex(sel.color))+'</div>'+
    '<div><h1>'+c.n+'</h1><p class="lede" style="margin-top:6px">'+c.blurb+'</p>'+
    '<div style="font-size:1.7rem;font-weight:700;margin-top:18px;font-variant-numeric:tabular-nums">'+money(s[1]*sel.qty)+'</div>'+
    '<label class="f" id="sl">Size</label><div class="opts" role="group" aria-labelledby="sl">'+c.s.map(function(x,i){return '<button type="button" class="opt'+(i===sel.size?' on':'')+'" data-size="'+i+'" aria-pressed="'+(i===sel.size)+'">'+x[0]+', '+money(x[1])+'</button>'}).join("")+'</div>'+
    colors+
    '<label class="f">Quantity</label><div class="st"><button type="button" data-q="-1" aria-label="Fewer">−</button><span aria-live="polite">'+sel.qty+'</span><button type="button" data-q="1" aria-label="More">+</button></div>'+
    '<div class="actions"><button class="btn" id="add" type="button">Add to my kit</button><a class="btn line" href="builder.html">View my kit</a></div>'+
    '<h2 class="h3" style="margin-top:32px">Best for</h2><p style="margin:6px 0 0">'+c.uses.join(", ")+'</p>'+
    '<ul class="specs">'+c.spec.map(function(x){return '<li><b>'+x[0]+'</b><span>'+x[1]+'</span></li>'}).join("")+'</ul></div>';
}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.size!==undefined){sel.size=+b.dataset.size;render()}
  else if(b.dataset.color){sel.color=b.dataset.color;render()}
  else if(b.dataset.q){sel.qty=Math.max(1,Math.min(6,sel.qty+(+b.dataset.q)));render()}
  else if(b.id==="add"){FK.addCook(c.id,sel.size,sel.qty,c.noColor?null:sel.color);FK.toast("Added "+sel.qty+" × "+c.n+" ("+c.s[sel.size][0]+") to your kit")}
});
render();
$("more").innerHTML=FK.ALLCOOK.filter(function(x){return x.id!==c.id}).slice(0,3).map(function(x){
  return '<a class="card" href="product.html?id='+x.id+'"><div class="pic'+(x.cat==="appliances"?"":" tint")+'">'+FK.art(x.kind,x.noColor?"#8FA88B":FK.colorHex(sel.color))+'</div><h3>'+x.n+'</h3><p>'+x.tag+'</p><div class="price">From '+money(x.s[0][1])+'</div></a>';
}).join("");
})();
</script>
</body>
</html>
