<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pots &amp; Pans — First Kitchen</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="cookware">
<div class="wrap">
<h1 class="page-title">Pots &amp; pans</h1>
<p class="lede">Open any piece to see sizes, what it's best for, and how it looks in each color.</p>
<div class="colors" id="colors" style="margin-bottom:18px"></div>
<div class="grid" id="list"></div>
</div>
<script src="data.js"></script>
<script src="site.js"></script>
<script>
(function(){
var FK=window.FK,color=(FK.getSet()&&FK.getSet().color)||"sage";
function render(){
  document.getElementById("colors").innerHTML=FK.COLORS.map(function(c){return '<button type="button" class="col'+(color===c.id?' on':'')+'" data-c="'+c.id+'"><div class="sw sm" style="background:'+c.c+'"></div>'+c.n+'</button>'}).join("");
  document.getElementById("list").innerHTML=FK.COOK.map(function(c){
    var sizes=c.s.map(function(s){return '<span class="pill">'+s[0]+'</span>'}).join("");
    return '<a class="card" href="product.html?id='+c.id+'&color='+color+'"><div class="pic">'+FK.art(c.kind,FK.colorHex(color))+'</div><h3>'+c.n+'</h3><p>'+c.tag+'</p><div style="margin-top:8px">'+sizes+'</div><div class="price">From '+FK.money(c.s[0][1])+'</div></a>';
  }).join("");
}
document.addEventListener("click",function(e){var b=e.target.closest("button");if(b&&b.dataset.c){color=b.dataset.c;render()}});
render();
})();
</script>
</body>
</html>
