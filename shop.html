<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop — First Kitchen</title>
<meta name="description" content="Pots and pans, small appliances, oils, spices and utensils for building and upgrading a kitchen.">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="shop">
<main>
<div class="wrap">
  <div class="page-head">
    <div>
      <h1 class="display" style="font-size:clamp(2.2rem,4.6vw,3.6rem)">Shop the kitchen</h1>
      <p class="lede">Open a pot, pan or appliance for sizes, colors and what it is best for. Add pantry items and utensils straight to your kit.</p>
    </div>
    <div class="art"><img src="images/cookware.svg" alt="" width="900" height="700"></div>
  </div>

  <div class="filters">
    <div class="tabs" id="tabs" role="group" aria-label="Category"></div>
    <div id="colorWrap" style="display:none">
      <div class="colors" id="colors" role="group" aria-label="Cookware color"></div>
    </div>
  </div>

  <div class="grid four" id="list" style="padding-bottom:20px"></div>
  <p class="note" style="margin-bottom:60px">Cookware color shows in the preview and carries into your kit. Prices shown are sample prices.</p>
</div>
</main>
<script src="data.js"></script>
<script src="site.js"></script>
<script>
(function(){
var FK=window.FK,$=function(i){return document.getElementById(i)},money=FK.money;
var q=new URLSearchParams(location.search);
var cat=q.get("cat")||"all",color=(FK.getSet()&&FK.getSet().color)||"sage";
var valid=FK.CATS.map(function(c){return c[0]});if(valid.indexOf(cat)<0)cat="all";

function pantry(){
  var out=[];
  [["Oils",FK.OILS,"bottle"],["Seasonings",FK.SEAS,"jar"],["Extra spices",FK.XSP,"jar"]].forEach(function(g,gi){
    g[1].forEach(function(r,i){out.push({id:r[0],n:r[1],note:r[2]||g[0],price:r[3],kind:g[2],col:["#D9C98E","#F9F5E9","#E9905F","#8FA88B","#293D55"][(i+gi)%5],sub:true})});
  });
  return out;
}
function utensils(){
  return FK.UTEN.map(function(r,i){return {id:r[0],n:r[1],note:"Utensil",price:r[3],kind:"tool",col:["#8FA88B","#E9905F","#293D55"][i%3],sub:false}});
}
function prodCard(c){
  var sizes=c.s.map(function(s){return '<span class="pill">'+s[0]+'</span>'}).join("");
  var tint=c.cat==="appliances"?"":" tint";
  return '<a class="card pcard" href="product.html?id='+c.id+(c.noColor?'':'&color='+color)+'"><div class="pic'+tint+'">'+FK.art(c.kind,c.noColor?"#8FA88B":FK.colorHex(color))+'</div><div class="grow"><h3>'+c.n+'</h3><p>'+c.tag+'</p><div style="margin-top:10px">'+sizes+'</div></div><div class="price">From '+money(c.s[0][1])+'</div></a>';
}
function itemCard(p){
  return '<div class="card pcard"><div class="pic">'+FK.art(p.kind,p.col)+'</div><div class="grow"><h3>'+p.n+'</h3><p>'+p.note+'</p></div><div class="price">'+money(p.price)+'</div>'+
    '<div class="acts"><button class="btn sm line" type="button" data-add="'+p.id+'">Add to kit</button>'+(p.sub?'<a class="btn sm" href="subscribe.html?item='+p.id+'">Subscribe</a>':'')+'</div></div>';
}
function render(){
  $("tabs").innerHTML=FK.CATS.map(function(c){return '<button type="button" class="opt'+(cat===c[0]?' on':'')+'" data-cat="'+c[0]+'" aria-pressed="'+(cat===c[0])+'">'+c[1]+'</button>'}).join("");
  var showColor=cat==="all"||cat==="cookware";
  $("colorWrap").style.display=showColor?"block":"none";
  $("colors").innerHTML=FK.COLORS.map(function(c){return '<button type="button" class="col'+(color===c.id?' on':'')+'" data-c="'+c.id+'" aria-label="'+c.n+'"><div class="sw sm" style="background:'+c.c+'"></div></button>'}).join("");
  var h="";
  if(cat==="all"||cat==="cookware")h+=FK.COOK.map(prodCard).join("");
  if(cat==="all"||cat==="appliances")h+=FK.APPL.map(prodCard).join("");
  if(cat==="all"||cat==="pantry")h+=pantry().map(itemCard).join("");
  if(cat==="all"||cat==="utensils")h+=utensils().map(itemCard).join("");
  $("list").innerHTML=h;
}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.cat){cat=b.dataset.cat;history.replaceState(null,"","?cat="+cat);render()}
  else if(b.dataset.c){color=b.dataset.c;render()}
  else if(b.dataset.add){FK.addItem(b.dataset.add,1);var r=FK.itemById(b.dataset.add);FK.toast("Added "+r[1]+" to your kit")}
});
render();
})();
</script>
</body>
</html>
